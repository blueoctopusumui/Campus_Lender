# Course: BCSE302P Database Systems Lab | Slot L25+L26

version: '3.8'

services:
  # MySQL 8 Database Service
  mysql_db:
    image: mysql:8.0
    container_name: campuslend_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: campuslend
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - campuslend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuslend_backend
    restart: unless-stopped
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:rootpassword123@mysql_db:3306/campuslend"
      JWT_SECRET: "campuslend_super_secret_jwt_key_24BCE0246_24BCE2516"
      FRONTEND_URL: "http://localhost:5173"
      ALLOWED_DOMAIN: "vit.ac.in"
      GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "your-google-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:5000/api/auth/google/callback"
    ports:
      - "5000:5000"
    networks:
      - campuslend_net

  # React + Vite Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuslend_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - campuslend_net

volumes:
  mysql_data:
    driver: local

networks:
  campuslend_net:
    driver: bridge
